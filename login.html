<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Apex Strategies - Login</title>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
    <style>
        :root {
            --bg-color: #0d1117;
            --card-bg: #161b22;
            --text-color: #c9d1d9;
            --input-bg: #21262d;
            --border-color: #30363d;
            --button-bg: #1f6feb;
            --button-hover: #388bfd;
            --success-color: #2ea043;
            --error-color: #f85149;
            --warning-color: #d29922;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Cairo', sans-serif; }
        
        body { 
            background-color: var(--bg-color); 
            color: var(--text-color); 
            display: flex; 
            justify-content: center; 
            align-items: center; 
            min-height: 100vh; 
            padding: 20px;
            background: radial-gradient(circle at center, #1a233a 0%, #0b0f19 100%);
        }

        .login-card {
            background: var(--card-bg);
            padding: 40px;
            border-radius: 16px;
            border: 1px solid var(--border-color);
            width: 100%;
            max-width: 480px;
            box-shadow: 0 25px 50px -12px rgba(0,0,0,0.5);
            position: relative;
            overflow: hidden;
        }

        .login-card::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            height: 3px;
            background: linear-gradient(90deg, #1f6feb, #8b5cf6);
        }

        .login-card h2 {
            text-align: center;
            margin-bottom: 5px;
            color: #ffffff;
            font-weight: 700;
            letter-spacing: 1px;
            font-size: 24px;
        }

        .login-card .subtitle {
            text-align: center;
            color: #8b949e;
            font-size: 14px;
            margin-bottom: 30px;
        }

        .form-group {
            display: flex;
            flex-direction: column;
            gap: 8px;
            margin-bottom: 18px;
        }

        .form-group label {
            font-size: 14px;
            color: #8b949e;
            font-weight: 600;
        }

        .form-group input,
        .form-group select {
            width: 100%;
            padding: 12px 16px;
            background: var(--input-bg);
            border: 1px solid var(--border-color);
            border-radius: 8px;
            color: white;
            font-size: 15px;
            transition: all 0.3s ease;
        }

        .form-group input:focus,
        .form-group select:focus {
            border-color: var(--button-bg);
            outline: none;
            box-shadow: 0 0 0 3px rgba(31, 111, 235, 0.15);
        }

        .form-group select option {
            background: var(--card-bg);
            color: white;
        }

        .form-row {
            display: flex;
            gap: 12px;
        }

        .form-row .form-group {
            flex: 1;
        }

        .btn-submit {
            width: 100%;
            padding: 14px;
            background: linear-gradient(135deg, var(--button-bg), #2563eb);
            border: none;
            border-radius: 8px;
            color: white;
            font-size: 18px;
            font-weight: 700;
            cursor: pointer;
            transition: all 0.3s ease;
            margin-top: 10px;
        }

        .btn-submit:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 20px rgba(31, 111, 235, 0.3);
        }

        .btn-submit:disabled {
            opacity: 0.6;
            cursor: not-allowed;
            transform: none;
        }

        .btn-secondary {
            width: 100%;
            padding: 12px;
            background: transparent;
            color: var(--button-bg);
            border: 1px solid var(--border-color);
            border-radius: 8px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
            margin-top: 10px;
        }

        .btn-secondary:hover {
            background: var(--input-bg);
            border-color: var(--button-bg);
        }

        .divider {
            text-align: center;
            margin: 20px 0;
            color: #8b949e;
            font-size: 14px;
            position: relative;
        }

        .divider::before,
        .divider::after {
            content: '';
            position: absolute;
            top: 50%;
            width: 35%;
            height: 1px;
            background: var(--border-color);
        }

        .divider::before { left: 0; }
        .divider::after { right: 0; }

        .message {
            text-align: center;
            margin-top: 15px;
            padding: 12px;
            border-radius: 8px;
            display: none;
            font-size: 14px;
            font-weight: 600;
        }

        .message.error {
            display: block;
            background: rgba(248, 81, 73, 0.1);
            border: 1px solid var(--error-color);
            color: var(--error-color);
        }

        .message.success {
            display: block;
            background: rgba(46, 160, 67, 0.1);
            border: 1px solid var(--success-color);
            color: var(--success-color);
        }

        .message.warning {
            display: block;
            background: rgba(210, 153, 34, 0.1);
            border: 1px solid var(--warning-color);
            color: var(--warning-color);
        }

        .loading {
            text-align: center;
            margin-top: 15px;
            display: none;
            color: var(--button-bg);
        }

        .loading::after {
            content: '...';
            animation: dots 1.5s steps(4, end) infinite;
        }

        @keyframes dots {
            0% { content: ''; }
            25% { content: '.'; }
            50% { content: '..'; }
            75% { content: '...'; }
        }

        .password-hint {
            font-size: 12px;
            color: #8b949e;
            margin-top: 4px;
        }

        .form-field-error {
            border-color: var(--error-color) !important;
        }

        /* ============================================== */
        /* ⭐ القسم الجديد - إعلان الترحيب */
        /* ============================================== */
        .welcome-box {
            background: linear-gradient(135deg, rgba(59, 130, 246, 0.08), rgba(139, 92, 246, 0.08));
            border: 1px solid rgba(59, 130, 246, 0.2);
            border-radius: 12px;
            padding: 16px 20px;
            margin-top: 20px;
            text-align: center;
            transition: all 0.3s ease;
        }

        .welcome-box:hover {
            background: linear-gradient(135deg, rgba(59, 130, 246, 0.12), rgba(139, 92, 246, 0.12));
            border-color: rgba(59, 130, 246, 0.4);
            transform: translateY(-2px);
        }

        .welcome-box .icon {
            font-size: 28px;
            color: #3b82f6;
            margin-bottom: 6px;
        }

        .welcome-box h4 {
            color: #f1f5f9;
            font-size: 16px;
            font-weight: 700;
            margin-bottom: 4px;
        }

        .welcome-box p {
            color: #94a3b8;
            font-size: 13px;
            line-height: 1.6;
        }

        .welcome-box .highlight {
            color: #60a5fa;
            font-weight: 600;
        }

        @media (max-width: 480px) {
            .login-card { padding: 25px; }
            .form-row { flex-direction: column; gap: 0; }
            .welcome-box h4 { font-size: 14px; }
            .welcome-box p { font-size: 12px; }
        }
    </style>
</head>
<body>
    <div class="login-card">
        <h2 id="form-title">🔐 تسجيل الدخول</h2>
        <p class="subtitle" id="form-subtitle">مرحباً بك في منصة Apex Strategies</p>

        <!-- ========================================== -->
        <!-- SIGN IN FORM -->
        <!-- ========================================== -->
        <div id="login-form">
            <div class="form-group">
                <label>📧 البريد الإلكتروني</label>
                <input type="email" id="login-email" placeholder="example@email.com" value="admin@apex.com">
            </div>
            <div class="form-group">
                <label>🔑 كلمة المرور</label>
                <input type="password" id="login-password" placeholder="أدخل كلمة المرور" value="admin123">
            </div>
            <button class="btn-submit" id="login-btn">🔓 تسجيل الدخول</button>
            <div class="divider">أو</div>
            <button class="btn-secondary" id="show-signup-btn">📝 إنشاء حساب جديد</button>
        </div>

        <!-- ========================================== -->
        <!-- SIGN UP FORM -->
        <!-- ========================================== -->
        <div id="signup-form" style="display: none;">
            <div class="form-row">
                <div class="form-group">
                    <label>👤 الاسم الأول</label>
                    <input type="text" id="signup-firstname" placeholder="الاسم الأول">
                </div>
                <div class="form-group">
                    <label>👤 اسم العائلة</label>
                    <input type="text" id="signup-lastname" placeholder="اسم العائلة">
                </div>
            </div>
            <div class="form-group">
                <label>📧 البريد الإلكتروني</label>
                <input type="email" id="signup-email" placeholder="example@email.com">
            </div>
            <div class="form-group">
                <label>📱 رقم الهاتف (اختياري)</label>
                <input type="text" id="signup-phone" placeholder="05xxxxxxxx">
            </div>
            <div class="form-group">
                <label>🏢 اسم الشركة (اختياري)</label>
                <input type="text" id="signup-company" placeholder="اسم الشركة">
            </div>
            <div class="form-group">
                <label>🔑 كلمة المرور</label>
                <input type="password" id="signup-password" placeholder="6 أحرف على الأقل">
                <span class="password-hint">كلمة المرور يجب أن تكون 6 أحرف على الأقل</span>
            </div>
            <div class="form-group">
                <label>📋 نوع الحساب</label>
                <select id="signup-account-type">
                    <option value="production">🏭 Production</option>
                    <option value="medical" selected>🏥 Medical</option>
                    <option value="financial">💰 Financial</option>
                </select>
            </div>
            <button class="btn-submit" id="signup-btn">✅ إنشاء حساب</button>
            <div class="divider">أو</div>
            <button class="btn-secondary" id="show-login-btn">🔓 لدي حساب بالفعل</button>
        </div>

        <!-- ========================================== -->
        <!-- MESSAGES -->
        <!-- ========================================== -->
        <div id="message" class="message"></div>
        <div id="loading" class="loading">⏳ جاري المعالجة</div>

        <!-- ========================================== -->
        <!-- ⭐ القسم الجديد - إعلان الترحيب (بدلاً من demo-box) -->
        <!-- ========================================== -->
        <div class="welcome-box">
            <div class="icon">
                <i class="fas fa-rocket"></i>
            </div>
            <h4>🚀 منصة Apex Strategies</h4>
            <p>
                منصة ذكاء الأعمال المتكاملة لتحليل البيانات وإدارة الأداء
                <br>
                <span class="highlight">سجل الآن واستمتع بتجربة احترافية</span>
            </p>
        </div>
    </div>

    <script>
        // ==============================================
        // DOM Elements
        // ==============================================
        const loginForm = document.getElementById('login-form');
        const signupForm = document.getElementById('signup-form');
        const showSignupBtn = document.getElementById('show-signup-btn');
        const showLoginBtn = document.getElementById('show-login-btn');
        const loginBtn = document.getElementById('login-btn');
        const signupBtn = document.getElementById('signup-btn');
        const messageEl = document.getElementById('message');
        const loadingEl = document.getElementById('loading');
        const formTitle = document.getElementById('form-title');
        const formSubtitle = document.getElementById('form-subtitle');

        const loginEmail = document.getElementById('login-email');
        const loginPassword = document.getElementById('login-password');
        const signupFirstname = document.getElementById('signup-firstname');
        const signupLastname = document.getElementById('signup-lastname');
        const signupEmail = document.getElementById('signup-email');
        const signupPhone = document.getElementById('signup-phone');
        const signupCompany = document.getElementById('signup-company');
        const signupPassword = document.getElementById('signup-password');
        const signupAccountType = document.getElementById('signup-account-type');

        // ==============================================
        // Configuration
        // ==============================================
        const API_BASE_URL = 'http://127.0.0.1:8000/api';

        // ==============================================
        // Helper Functions
        // ==============================================
        function showMessage(text, type = 'error') {
            messageEl.textContent = text;
            messageEl.className = `message ${type}`;
        }

        function hideMessage() {
            messageEl.className = 'message';
            messageEl.textContent = '';
        }

        function setLoading(loading) {
            loadingEl.style.display = loading ? 'block' : 'none';
            loginBtn.disabled = loading;
            signupBtn.disabled = loading;
        }

        function clearErrors() {
            document.querySelectorAll('.form-field-error').forEach(el => {
                el.classList.remove('form-field-error');
            });
        }

        function markError(field) {
            field.classList.add('form-field-error');
        }

        function validateEmail(email) {
            return /^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email);
        }

        function saveAuthData(data) {
            localStorage.setItem('access_token', data.access_token);
            if (data.refresh_token) {
                localStorage.setItem('refresh_token', data.refresh_token);
            }
            if (data.expires_in) {
                const expiry = Date.now() + (data.expires_in * 1000);
                localStorage.setItem('token_expiry', expiry.toString());
            }
            localStorage.setItem('user_data', JSON.stringify(data));
            localStorage.setItem('user_id', data.user_id.toString());
        }

        // ==============================================
        // Form Switching
        // ==============================================
        function showLoginForm() {
            loginForm.style.display = 'block';
            signupForm.style.display = 'none';
            formTitle.textContent = '🔐 تسجيل الدخول';
            formSubtitle.textContent = 'مرحباً بك في منصة Apex Strategies';
            hideMessage();
            clearErrors();
        }

        function showSignupForm() {
            loginForm.style.display = 'none';
            signupForm.style.display = 'block';
            formTitle.textContent = '📝 إنشاء حساب جديد';
            formSubtitle.textContent = 'انضم إلى منصة Apex Strategies';
            hideMessage();
            clearErrors();
        }

        showSignupBtn.addEventListener('click', showSignupForm);
        showLoginBtn.addEventListener('click', showLoginForm);

        // ==============================================
        // Login Handler
        // ==============================================
        async function handleLogin() {
            const email = loginEmail.value.trim();
            const password = loginPassword.value;

            if (!email || !password) {
                showMessage('⚠️ الرجاء إدخال البريد الإلكتروني وكلمة المرور', 'error');
                if (!email) markError(loginEmail);
                if (!password) markError(loginPassword);
                return;
            }

            if (!validateEmail(email)) {
                showMessage('⚠️ الرجاء إدخال بريد إلكتروني صحيح', 'error');
                markError(loginEmail);
                return;
            }

            hideMessage();
            clearErrors();
            setLoading(true);

            try {
                console.log('🔄 Attempting login for:', email);
                
                const response = await fetch(`${API_BASE_URL}/signin`, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                        'ngrok-skip-browser-warning': 'true'
                    },
                    body: JSON.stringify({ email, password })
                });

                const data = await response.json();

                if (response.ok) {
                    saveAuthData(data);
                    showMessage('✅ تم تسجيل الدخول بنجاح! جاري التوجيه...', 'success');
                    
                    setTimeout(() => {
                        if (data.is_admin) {
                            window.location.href = 'admin-dashboard.html';
                        } else {
                            window.location.href = 'dashboard.html';
                        }
                    }, 1500);
                } else {
                    showMessage(`❌ ${data.detail || 'فشل تسجيل الدخول'}`, 'error');
                }
            } catch (error) {
                console.error('❌ Login error:', error);
                showMessage('❌ خطأ في الاتصال بالسيرفر. تأكد من تشغيل السيرفر.', 'error');
            } finally {
                setLoading(false);
            }
        }

        // ==============================================
        // Signup Handler
        // ==============================================
        async function handleSignup() {
            const firstName = signupFirstname.value.trim();
            const lastName = signupLastname.value.trim();
            const email = signupEmail.value.trim();
            const phone = signupPhone.value.trim();
            const company = signupCompany.value.trim();
            const password = signupPassword.value;
            const accountType = signupAccountType.value;

            let hasError = false;
            clearErrors();

            if (!firstName || firstName.length < 2) {
                showMessage('⚠️ الاسم الأول يجب أن يكون حرفين على الأقل', 'error');
                markError(signupFirstname);
                hasError = true;
            }

            if (!lastName || lastName.length < 2) {
                showMessage('⚠️ اسم العائلة يجب أن يكون حرفين على الأقل', 'error');
                markError(signupLastname);
                hasError = true;
            }

            if (!email) {
                showMessage('⚠️ الرجاء إدخال البريد الإلكتروني', 'error');
                markError(signupEmail);
                hasError = true;
            } else if (!validateEmail(email)) {
                showMessage('⚠️ الرجاء إدخال بريد إلكتروني صحيح', 'error');
                markError(signupEmail);
                hasError = true;
            }

            if (!password || password.length < 6) {
                showMessage('⚠️ كلمة المرور يجب أن تكون 6 أحرف على الأقل', 'error');
                markError(signupPassword);
                hasError = true;
            }

            if (hasError) return;

            hideMessage();
            setLoading(true);

            try {
                console.log('🔄 Attempting signup for:', email);
                
                const response = await fetch(`${API_BASE_URL}/signup`, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                        'ngrok-skip-browser-warning': 'true'
                    },
                    body: JSON.stringify({
                        first_name: firstName,
                        last_name: lastName,
                        email: email,
                        password: password,
                        account_type: accountType,
                        phone: phone,
                        company_name: company
                    })
                });

                const data = await response.json();

                if (response.ok) {
                    saveAuthData(data);
                    showMessage('✅ تم إنشاء الحساب بنجاح! جاري التوجيه...', 'success');
                    
                    setTimeout(() => {
                        window.location.href = 'welcome.html';
                    }, 1500);
                } else {
                    showMessage(`❌ ${data.detail || 'فشل إنشاء الحساب'}`, 'error');
                }
            } catch (error) {
                console.error('❌ Signup error:', error);
                showMessage('❌ خطأ في الاتصال بالسيرفر. تأكد من تشغيل السيرفر.', 'error');
            } finally {
                setLoading(false);
            }
        }

        // ==============================================
        // Event Listeners
        // ==============================================
        loginBtn.addEventListener('click', handleLogin);
        signupBtn.addEventListener('click', handleSignup);

        loginPassword.addEventListener('keypress', (e) => {
            if (e.key === 'Enter') handleLogin();
        });

        signupPassword.addEventListener('keypress', (e) => {
            if (e.key === 'Enter') handleSignup();
        });

        document.querySelectorAll('input, select').forEach(el => {
            el.addEventListener('input', () => {
                el.classList.remove('form-field-error');
                hideMessage();
            });
            el.addEventListener('change', () => {
                el.classList.remove('form-field-error');
                hideMessage();
            });
        });

        // ==============================================
        // Auto-login check
        // ==============================================
        const token = localStorage.getItem('access_token');
        const tokenExpiry = localStorage.getItem('token_expiry');

        if (token && token.length > 20) {
            if (tokenExpiry && Date.now() < parseInt(tokenExpiry)) {
                console.log('✅ Valid token found, redirecting...');
                const userData = localStorage.getItem('user_data');
                if (userData) {
                    try {
                        const data = JSON.parse(userData);
                        if (data.is_admin) {
                            window.location.href = 'admin-dashboard.html';
                        } else {
                            window.location.href = 'dashboard.html';
                        }
                    } catch (e) {
                        window.location.href = 'dashboard.html';
                    }
                }
            } else {
                console.log('⚠️ Token expired, clearing...');
                localStorage.removeItem('access_token');
                localStorage.removeItem('refresh_token');
                localStorage.removeItem('token_expiry');
                localStorage.removeItem('user_data');
                localStorage.removeItem('user_id');
            }
        }

        console.log('🔐 Login page ready');
        console.log('📍 API:', API_BASE_URL);
    </script>
</body>
</html>
