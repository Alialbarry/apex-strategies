<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Apex Strategies - Login</title>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-color: #0d1117;
            --card-bg: #161b22;
            --text-color: #c9d1d9;
            --input-bg: #21262d;
            --border-color: #30363d;
            --button-bg: #1f6feb;
            --button-hover: #388bfd;
        }
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Cairo', sans-serif; }
        body { background-color: var(--bg-color); color: var(--text-color); display: flex; justify-content: center; align-items: center; min-height: 100vh; }
        .login-card { background: var(--card-bg); padding: 40px; border-radius: 12px; border: 1px solid var(--border-color); width: 100%; max-width: 450px; box-shadow: 0 8px 24px rgba(0,0,0,0.5); }
        .login-card h2 { text-align: center; margin-bottom: 30px; color: #ffffff; font-weight: 700; letter-spacing: 1px; }
        .form-group { display: flex; flex-direction: column; gap: 8px; margin-bottom: 20px; }
        .form-group input { width: 100%; padding: 12px; background: var(--input-bg); border: 1px solid var(--border-color); border-radius: 6px; color: white; text-align: center; font-size: 16px; }
        .form-group input:focus { border-color: var(--button-hover); outline: none; }
        .btn-submit { width: 100%; padding: 14px; background: var(--button-bg); border: none; border-radius: 6px; color: white; font-size: 18px; font-weight: 700; cursor: pointer; transition: background 0.2s; margin-top: 10px; }
        .btn-submit:hover { background: var(--button-hover); }
        .footer-link { text-align: center; margin-top: 20px; font-size: 14px; color: #8b949e; }
        .footer-link a { color: var(--button-bg); text-decoration: none; }
    </style>
</head>
<body>

    <div class="login-card">
        <h2>تسجيل الدخول إلى المنصة</h2>
        <form id="login-form">
            <div class="form-group">
                <input type="email" id="email" placeholder="البريد الإلكتروني" required value="ali.albarry.404@gmail.com">
            </div>
            <div class="form-group">
                <input type="password" id="password" placeholder="كلمة المرور" required>
            </div>
            <button type="submit" class="btn-submit">دخول</button>
        </form>
        <div class="footer-link">
            ليس لديك حساب؟ <a href="#">إنشاء حساب جديد</a>
        </div>
    </div>

    <script>
        document.getElementById('login-form').addEventListener('submit', async (e) => {
            e.preventDefault();
            
            const email = document.getElementById('email').value;
            const password = document.getElementById('password').value;
            
            const API_BASE_URL = 'https://veteran-antibody-strep.ngrok-free.dev/api';

            try {
                // إرسال طلب تسجيل الدخول مع الهيدر الحاسم لمنع حظر Ngrok
                const response = await fetch(`${API_BASE_URL}/signin`, {
                    method: 'POST',
                    headers: { 
                        'Content-Type': 'application/json',
                        'ngrok-skip-browser-warning': 'true' // تخطي صفحة التحذير وحظر الـ CORS
                    },
                    body: JSON.stringify({ email: email, password: password })
                });

                const result = await response.json();

                if (response.ok && result.access_token) {
                    // حفظ الـ Token بنجاح وتحويل المستخدم إلى الداشبورد الحية
                    localStorage.setItem('access_token', result.access_token);
                    alert("تم تسجيل الدخول بنجاح!");
                    window.location.href = 'dashboard.html';
                } else {
                    alert(`فشل الدخول: ${result.detail || "خطأ غير معروف"}`);
                }
            } catch (error) {
                console.error("Login error:", error);
                alert("حدث خطأ أثناء الاتصال بالسيرفر. تأكد من أن الباكيند ونفق Ngrok يعملان بنجاح.");
            }
        });
    </script>
</body>
</html>
