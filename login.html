<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>بوابة الوصول الموحدة | Apex Strategies</title>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/style.css">
</head>
<body class="auth-body">
    <div class="auth-container">
        <h2 id="form-title">تسجيل الدخول إلى المنصة</h2>
        
        <form id="signin-form">
            <input type="email" id="login-email" placeholder="البريد الإلكتروني" required>
            <input type="password" id="login-password" placeholder="كلمة المرور" required>
            <button type="submit" class="btn-block">دخول</button>
            <p class="toggle-text">ليس لديك حساب؟ <a href="#" id="show-signup">إنشاء حساب جديد</a></p>
        </form>

        <form id="signup-form" style="display: none;">
            <input type="text" id="reg-firstname" placeholder="الاسم الأول" required>
            <input type="text" id="reg-lastname" placeholder="الكنية" required>
            <input type="email" id="reg-email" placeholder="البريد الإلكتروني" required>
            <input type="password" id="reg-password" placeholder="كلمة المرور" required>
            <select id="reg-sector" required>
                <option value="" disabled selected>اختر القطاع العملياتي للشركة</option>
                <option value="production">قطاع الإنتاج والتصنيع</option>
                <option value="medical">القطاع الطبي والعيادات</option>
                <option value="financial">القطاع المالي والتجاري</option>
            </select>
            <button type="submit" class="btn-block">تفعيل الحساب واللوحة</button>
            <p class="toggle-text">لديك حساب بالفعل؟ <a href="#" id="show-signin">تسجيل الدخول</a></p>
        </form>
    </div>

    <script>
        const API_BASE_URL = 'https://veteran-antibody-strep.ngrok-free.dev/api';

        // تنظيف التوكن القديم عند فتح الصفحة لضمان سلامة الجلسة
        window.addEventListener('DOMContentLoaded', () => {
            localStorage.removeItem('access_token');
        });

        // التحويل إلى واجهة إنشاء حساب جديد
        document.getElementById('show-signup').addEventListener('click', (e) => {
            e.preventDefault();
            document.getElementById('signin-form').style.display = 'none';
            document.getElementById('signup-form').style.display = 'flex';
            document.getElementById('form-title').innerText = 'إنشاء حساب جديد';
        });

        // التحويل إلى واجهة تسجيل الدخول
        document.getElementById('show-signin').addEventListener('click', (e) => {
            e.preventDefault();
            document.getElementById('signup-form').style.display = 'none';
            document.getElementById('signin-form').style.display = 'flex';
            document.getElementById('form-title').innerText = 'تسجيل الدخول إلى المنصة';
        });

        // 1. معالجة إرسال نموذج تسجيل الدخول (Sign In)
        document.getElementById('signin-form').addEventListener('submit', async (e) => {
            e.preventDefault();
            
            const email = document.getElementById('login-email').value;
            const password = document.getElementById('login-password').value;

            try {
                const response = await fetch(`${API_BASE_URL}/signin`, {
                    method: 'POST',
                    headers: { 
                        'Content-Type': 'application/json' 
                    },
                    body: JSON.stringify({
                        email: email, 
                        password: password
                    })
                });

                if (response.ok) {
                    const data = await response.json();
                    if (data.access_token) {
                        localStorage.setItem('access_token', data.access_token);
                        window.location.href = 'dashboard.html';
                    } else {
                        alert("تم تسجيل الدخول ولكن لم يتم استقبال توكن الجلسة الموثق.");
                    }
                } else {
                    const errResult = await response.json();
                    let errorText = errResult.detail ? (typeof errResult.detail === 'object' ? JSON.stringify(errResult.detail) : errResult.detail) : "البريد الإلكتروني أو كلمة المرور غير صحيحة";
                    alert(`فشل الدخول: ${errorText}`);
                }
            } catch (error) {
                console.error("Signin Error:", error);
                alert("حدث خطأ في الاتصال بالخادم، تأكد من تشغيل الباكيند ورابط ngrok بشكل مستقر.");
            }
        });

        // 2. معالجة إرسال نموذج إنشاء حساب جديد (Sign Up) - تم إضافته وتأمينه كاملاً
        document.getElementById('signup-form').addEventListener('submit', async (e) => {
            e.preventDefault();

            const firstName = document.getElementById('reg-firstname').value;
            const lastName = document.getElementById('reg-lastname').value;
            const email = document.getElementById('reg-email').value;
            const password = document.getElementById('reg-password').value;
            const accountType = document.getElementById('reg-sector').value;

            try {
                const response = await fetch(`${API_BASE_URL}/signup`, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({
                        first_name: firstName,
                        last_name: lastName,
                        email: email,
                        password: password,
                        account_type: accountType
                    })
                });

                if (response.ok) {
                    const data = await response.json();
                    if (data.access_token) {
                        localStorage.setItem('access_token', data.access_token);
                        alert("تم إنشاء حسابك وبناء لوحة تحكم قطاعك الافتراضية بنجاح!");
                        window.location.href = 'dashboard.html';
                    } else {
                        alert("تم إنشاء الحساب، يرجى التوجه لصفحة تسجيل الدخول.");
                    }
                } else {
                    const errResult = await response.json();
                    let errorText = errResult.detail ? (typeof errResult.detail === 'object' ? JSON.stringify(errResult.detail) : errResult.detail) : "يرجى التحقق من صحة البيانات المدخلة وطول كلمة المرور.";
                    alert(`فشل إنشاء الحساب: ${errorText}`);
                }
            } catch (error) {
                console.error("Signup Error:", error);
                alert("حدث خطأ في الاتصال، تأكد من أن السيرفر يعمل ونفق ngrok مفتوح.");
            }
        });
    </script>
</body>
</html>
