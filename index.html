<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Apex Strategies</title>
  <style>
    body {
      font-family: Arial;
      margin: 0;
      background: #f5f6fa;
    }

    header {
      background: #1e3c72;
      color: white;
      text-align: center;
      padding: 50px 20px;
    }

    header h1 {
      margin: 0;
      font-size: 40px;
    }

    header p {
      margin-top: 10px;
      font-size: 18px;
    }

    .container {
      padding: 30px;
      text-align: center;
    }

    .card {
      background: white;
      padding: 20px;
      margin: 15px;
      border-radius: 12px;
      display: inline-block;
      width: 280px;
      box-shadow: 0 4px 10px rgba(0,0,0,0.1);
      transition: 0.3s;
    }

    .card:hover {
      transform: translateY(-5px);
    }

    button {
      background: #27ae60;
      color: white;
      border: none;
      padding: 10px 15px;
      border-radius: 5px;
      cursor: pointer;
      margin-top: 10px;
    }

    footer {
      margin-top: 40px;
      padding: 20px;
      text-align: center;
      background: #ddd;
    }
  </style>
</head>

<body>

<header>
  <h1>Apex Strategies</h1>
  <p>Data Dashboards That Drive Decisions</p>
</header>

<div class="container">

 <div class="card">
  <img src="sales11.png" style="width:100%; border-radius:10px;">
  <h3>Production Dashboard</h3>
  <p>Optimize output and reduce downtime.</p>
  <button>View Details</button>
</div>

  <div class="card">
    <h3>Sales Dashboard</h3>
    <p>Track performance and increase revenue.</p>
    <button>View</button>
  </div>

  <div class="card">
    <h3>KPI Dashboard</h3>
    <p>Monitor key metrics in real time.</p>
    <button>View</button>
  </div>

</div>

<footer>
  <p>Contact: your-email@email.com</p>
</footer>

</body>
</html>
