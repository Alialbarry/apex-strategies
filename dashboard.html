<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Apex Strategies - Clinic Data Analysis</title>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700&display=swap" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    
    <style>
        :root {
            --primary-bg: #F4F7F6;
            --sidebar-bg: #FFFFFF;
            --card-bg: #FFFFFF;
            --text-color: #2D3748;
            --text-muted: #718096;
            --green-accent: #00B67A;
            --purple-accent: #E040FB;
            --blue-accent: #3182CE;
            --border-color: #E2E8F0;
        }
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Cairo', sans-serif; }
        body { background-color: var(--primary-bg); color: var(--text-color); display: flex; min-height: 100vh; }
        .dashboard-wrapper { display: flex; width: 100%; }
        
        .filter-sidebar {
            width: 280px; background: var(--sidebar-bg); border-left: 1px solid var(--border-color);
            padding: 24px; display: flex; flex-direction: column; gap: 24px;
        }
        .brand-area { text-align: center; padding-bottom: 20px; border-bottom: 1px solid var(--border-color); }
        .brand-area h2 { font-size: 22px; color: var(--blue-accent); font-weight: 700; }
        
        .filter-group { display: flex; flex-direction: column; gap: 10px; }
        .filter-group label { font-weight: 600; font-size: 14px; }
        .filter-group input[type="text"] {
            width: 100%; padding: 8px 12px; border: 1px solid var(--border-color); border-radius: 6px; text-align: center;
        }
        .checkbox-list { display: flex; flex-direction: column; gap: 8px; }
        .checkbox-item { display: flex; align-items: center; gap: 10px; font-size: 13px; cursor: pointer; }
        .custom-file-upload {
            display: block; background: linear-gradient(135deg, var(--blue-accent), #2B6CB0);
            color: white; text-align: center; padding: 12px; border-radius: 8px; font-weight: 600; cursor: pointer;
            transition: transform 0.2s;
        }
        .custom-file-upload:hover { transform: translateY(-2px); }
        .main-content { flex: 1; padding: 32px; display: flex; flex-direction: column; gap: 32px; }
        .dashboard-header { background: #FFFFFF; padding: 20px; border-radius: 12px; text-align: center; }
        .dashboard-header h1 { font-size: 24px; color: var(--purple-accent); font-weight: 700; }
        .kpi-section { display: flex; gap: 24px; }
        .kpi-card {
            flex: 1; background: var(--card-bg); border-radius: 12px; padding: 24px;
            border: 1px solid var(--border-color); text-align: center;
        }
        .kpi-card span { font-size: 14px; color: var(--text-muted); font-weight: 600; }
        .kpi-card h2 { font-size: 32px; font-weight: 700; }
        .kpi-card.revenue h2 { color: var(--green-accent); }
        .kpi-card.appointments h2 { color: var(--purple-accent); }
        .kpi-card.rate h2 { color: #319795; }
        .charts-grid { display: grid; grid-template-columns: 1.6fr 1.4fr; gap: 24px; min-height: 380px; }
        .chart-box { background: var(--card-bg); padding: 24px; border-radius: 12px; border: 1px solid var(--border-color); display: flex; flex-direction: column; gap: 16px; }
        .chart-container { position: relative; flex: 1; width: 100%; height: 100%; }
    </style>
</head>
<body>
    <div class="dashboard-wrapper">
        <aside class="filter-sidebar">
            <div class="brand-area">
                <h2 id="dashboard-title">APEX STRATEGIES</h2>
                <span>CLINIC ANALYSIS</span>
            </div>
            
            <div class="filter-group">
                <label>Data Range</label>
                <input type="text" value="1/1/2026  -  4/11/2026" disabled>
            </div>
            
            <div class="filter-group">
                <label>Doctor Name</label>
                <div class="checkbox-list">
                    <label class="checkbox-item"><input type="checkbox" class="doctor-filter" value="Dr. Ahmad" checked> Dr. Ahmad</label>
                    <label class="checkbox-item"><input type="checkbox" class="doctor-filter" value="Dr. Layla" checked> Dr. Layla</label>
                    <label class="checkbox-item"><input type="checkbox" class="doctor-filter" value="Dr. Sarah" checked> Dr. Sarah</label>
                </div>
            </div>
            
            <div class="filter-group">
                <label>Service Type</label>
                <div class="checkbox-list">
                    <label class="checkbox-item"><input type="checkbox" class="service-filter" value="Cleaning" checked> Cleaning</label>
                    <label class="checkbox-item"><input type="checkbox" class="service-filter" value="Filling" checked> Filling</label>
                    <label class="checkbox-item"><input type="checkbox" class="service-filter" value="Implant" checked> Implant</label>
                </div>
            </div>
            
            <div class="filter-group upload-box">
                <label for="excel-file-input" class="custom-file-upload"> 📁  رفع ملف البيانات (Excel)</label>
                <input type="file" id="excel-file-input" accept=".xlsx, .xls" style="display:none;">
                <span id="file-name-display" style="font-size: 11px; color: var(--text-muted); text-align: center; display: block; margin-top: 5px;"></span>
            </div>
        </aside>
        
        <main class="main-content">
            <header class="dashboard-header">
                <h1 id="main-header-title">APEX STRATEGIES : CLINIC DATA ANALYSIS</h1>
            </header>
            
            <section class="kpi-section" id="kpi-container">
                <div class="kpi-card revenue"><span>Total Revenue</span><h2 id="kpi-rev">$0.0</h2></div>
                <div class="kpi-card appointments"><span>Total Appointment</span><h2 id="kpi-app">0</h2></div>
                <div class="kpi-card rate"><span>No_Show Rate</span><h2 id="kpi-rate">0.0%</h2></div>
            </section>
            
            <section class="charts-grid">
                <div class="chart-box">
                    <h3>Monthly Revenue Trend</h3>
                    <div class="chart-container"><canvas id="revenueTrendChart"></canvas></div>
                </div>
                <div class="chart-box">
                    <h3>Sum of Revenue by Lead_Source</h3>
                    <div class="chart-container"><canvas id="leadSourceChart"></canvas></div>
                </div>
            </section>
        </main>
    </div>

    <script>
        document.addEventListener('DOMContentLoaded', async () => {
            let token = localStorage.getItem('access_token');
            if (!token || token === "null" || token === "undefined" || token.length < 10) {
                token = prompt(" 🔒  لم يتم استيراد رمز الجلسة تلقائياً. إذا كنت تملك الـ Token، يرجى لصقه هنا لتشغيل اللوحة الحية:");
                if (token && token.length > 10) {
                    localStorage.setItem('access_token', token);
                } else {
                    alert("تنبيه: لا يمكن جلب البيانات دون وجود Token صالح.");
                    return;
                }
            }

            const API_BASE_URL = 'https://veteran-antibody-strep.ngrok-free.dev/api';
            let revenueTrendChart = null;
            let leadSourceChart = null;
            let rawUploadedData = []; // المصفوفة العامة للاحتفاظ بالبيانات النشطة

            // دالة رسم وتحديث اللوحة بناءً على البيانات النشطة والمفلترة
            function updateDashboardUI(records) {
                if (!records || records.length === 0) {
                    document.getElementById('kpi-rev').textContent = "$0.0";
                    document.getElementById('kpi-app').textContent = "0";
                    document.getElementById('kpi-rate').textContent = "0.0%";
                    if (revenueTrendChart) revenueTrendChart.destroy();
                    if (leadSourceChart) leadSourceChart.destroy();
                    return;
                }

                let totalRevenue = 0;
                let totalAppointments = records.length;
                let noShowCount = 0;
                let trendData = {};
                let leadData = {};

                records.forEach(item => {
                    let rev = parseFloat(item.Revenue || item.revenue || item.Amount || item.amount || 0);
                    totalRevenue += rev;

                    let status = (item.Status || item.status || '').toLowerCase();
                    if (status === 'no_show' || status === 'no-show' || item.no_show === true || item.No_Show === true) {
                        noShowCount++;
                    }

                    let month = item.Month || item.month || 'أخرى';
                    trendData[month] = (trendData[month] || 0) + rev;

                    let source = item.Lead_Source || item.lead_source || 'Unknown';
                    leadData[source] = (leadData[source] || 0) + rev;
                });

                document.getElementById('kpi-rev').textContent = `$${totalRevenue.toLocaleString()}`;
                document.getElementById('kpi-app').textContent = totalAppointments;
                let noShowRate = totalAppointments > 0 ? ((noShowCount / totalAppointments) * 100).toFixed(1) : 0;
                document.getElementById('kpi-rate').textContent = `${noShowRate}%`;

                // تحديث مخطط Monthly Revenue Trend
                const ctxLine = document.getElementById('revenueTrendChart').getContext('2d');
                if (revenueTrendChart) revenueTrendChart.destroy();
                revenueTrendChart = new Chart(ctxLine, {
                    type: 'line',
                    data: {
                        labels: Object.keys(trendData),
                        datasets: [{
                            label: 'Monthly Revenue',
                            data: Object.values(trendData),
                            borderColor: '#E040FB',
                            backgroundColor: 'rgba(224, 64, 251, 0.1)',
                            fill: true,
                            tension: 0.3
                        }]
                    },
                    options: { responsive: true, maintainAspectRatio: false }
                });

                // تحديث مخطط Revenue by Lead_Source
                const ctxBar = document.getElementById('leadSourceChart').getContext('2d');
                if (leadSourceChart) leadSourceChart.destroy();
                leadSourceChart = new Chart(ctxBar, {
                    type: 'bar',
                    data: {
                        labels: Object.keys(leadData),
                        datasets: [{
                            data: Object.values(leadData),
                            backgroundColor: ['#3182CE', '#319795', '#805AD5', '#D53F8C', '#4A5568']
                        }]
                    },
                    options: {
                        indexAxis: 'y',
                        responsive: true,
                        maintainAspectRatio: false,
                        plugins: { legend: { display: false } }
                    }
                });
            }

            // دالة تطبيق الفلاتر حياً على البيانات المرفوعة
            function applyLiveFilters() {
                if (!rawUploadedData || rawUploadedData.length === 0) return;

                // جلب القيم المحددة من الفلاتر الجانبية
                const selectedDoctors = Array.from(document.querySelectorAll('.doctor-filter:checked')).map(cb => cb.value.toLowerCase());
                const selectedServices = Array.from(document.querySelectorAll('.service-filter:checked')).map(cb => cb.value.toLowerCase());

                // تصفية المصفوفة
                const filteredRecords = rawUploadedData.filter(item => {
                    const docName = (item.Doctor_Name || item.doctor_name || item.Doctor || '').toLowerCase();
                    const svcType = (item.Service_Type || item.service_type || item.Service || '').toLowerCase();

                    // التحقق من المطابقة (إذا كانت حقول الملف فارغة، نعتبرها متطابقة لتجنب الاختفاء)
                    const matchesDoctor = selectedDoctors.length === 0 || selectedDoctors.some(doc => docName.includes(doc) || doc.includes(docName));
                    const matchesService = selectedServices.length === 0 || selectedServices.some(svc => svcType.includes(svc) || svc.includes(svcType));

                    return matchesDoctor && matchesService;
                });

                // إعادة رسم اللوحة بالبيانات المفلترة
                updateDashboardUI(filteredRecords);
            }

            // ربط مستمعات الأحداث للفلاتر لتحديث اللوحة فوراً عند التغيير
            document.querySelectorAll('.doctor-filter, .service-filter').forEach(checkbox => {
                checkbox.addEventListener('change', applyLiveFilters);
            });

            // جلب الإعدادات والبيانات الافتراضية للوحة عند بداية الدخول
            async function loadDashboardData() {
                try {
                    const layoutRes = await fetch(`${API_BASE_URL}/dashboard`, {
                        headers: { 'Authorization': `Bearer ${token}`, 'ngrok-skip-browser-warning': 'true' }
                    });
                    if (layoutRes.ok) {
                        const layout = await layoutRes.json();
                        document.getElementById('dashboard-title').textContent = layout.dashboard_name.toUpperCase();
                        document.getElementById('main-header-title').textContent = layout.dashboard_name.toUpperCase();
                    }

                    const analyticsRes = await fetch(`${API_BASE_URL}/dashboard/analytics`, {
                        headers: { 'Authorization': `Bearer ${token}`, 'ngrok-skip-browser-warning': 'true' }
                    });
                    if (analyticsRes.ok) {
                        const defaultData = await analyticsRes.json();
                        // إذا كانت البيانات القادمة من الباكيند هي الهيكل الافتراضي للبطاقات
                        if (defaultData && defaultData.length > 0 && defaultData[0].metric_name) {
                            // تحويل الهيكل الافتراضي ليعمل على المخططات بشكل طبيعي
                            let mockRecords = [];
                            // عرض القيم المباشرة إن وجدت
                            defaultData.forEach(m => {
                                if(m.metric_name === "Total Revenue") document.getElementById('kpi-rev').textContent = m.calculated_value;
                                if(m.metric_name === "Total Appointment") document.getElementById('kpi-app').textContent = m.calculated_value;
                                if(m.metric_name === "No_Show Rate") document.getElementById('kpi-rate').textContent = m.calculated_value;
                            });
                        }
                    }
                } catch (err) {
                    console.error("Error loading initial data:", err);
                }
            }

            // معالجة رفع ملف الإكسيل وتحديث اللوحة بالبيانات الحية فوراً
            const fileInput = document.getElementById('excel-file-input');
            const nameDisplay = document.getElementById('file-name-display');

            fileInput.addEventListener('change', async (e) => {
                const file = e.target.files[0];
                if (!file) return;
                nameDisplay.textContent = `📄 ${file.name}`;

                const formData = new FormData();
                formData.append('file', file);

                try {
                    const response = await fetch(`${API_BASE_URL}/dashboard/upload-excel`, {
                        method: 'POST',
                        headers: { 
                            'Authorization': `Bearer ${token}`,
                            'ngrok-skip-browser-warning': 'true'
                        },
                        body: formData
                    });

                    if (response.ok) {
                        const result = await response.json();
                        alert("تم رفع ومعالجة ملف الإكسيل بنجاح وتحديث اللوحة حياً!");
                        
                        // تخزين السجلات المرفوعة حياً بالمتغير العام لتسهيل الفلترة اللحظية
                        rawUploadedData = result.analytics || result.data || (Array.isArray(result) ? result : []);
                        
                        // تحديث الرسوم والبطاقات فوراً بالبيانات الحية المرفوعة
                        updateDashboardUI(rawUploadedData);
                    } else {
                        const errData = await response.json().catch(() => ({}));
                        alert(`فشل رفع الملف: ${errData.detail || "تأكد من هيكلية الملف وصلاحية الجلسة"}`);
                    }
                } catch (error) {
                    console.error("Upload error:", error);
                    alert("حدث خطأ أثناء الاتصال بالسيرفر لمعالجة البيانات.");
                }
            });

            await loadDashboardData();
        });
    </script>
</body>
</html>
