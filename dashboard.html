<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Apex Strategies - Dashboard</title>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700&display=swap" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
    <style>
        :root {
            --primary-bg: #0f172a;
            --sidebar-bg: #1a233a;
            --card-bg: #1e293b;
            --text-color: #f1f5f9;
            --text-muted: #94a3b8;
            --green-accent: #10b981;
            --purple-accent: #8b5cf6;
            --blue-accent: #3b82f6;
            --border-color: #334155;
            --shadow-sm: 0 1px 3px rgba(0,0,0,0.3);
            --shadow-md: 0 4px 6px rgba(0,0,0,0.4);
            --danger: #ef4444;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Cairo', sans-serif; }
        
        body { 
            background-color: var(--primary-bg); 
            color: var(--text-color); 
            display: flex; 
            min-height: 100vh;
        }

        .dashboard-wrapper { display: flex; width: 100%; }

        .filter-sidebar {
            width: 280px;
            min-height: 100vh;
            background: var(--sidebar-bg);
            border-left: 1px solid var(--border-color);
            padding: 24px;
            display: flex;
            flex-direction: column;
            gap: 24px;
            position: sticky;
            top: 0;
            height: 100vh;
            overflow-y: auto;
            box-shadow: var(--shadow-sm);
            z-index: 10;
        }

        .brand-area {
            text-align: center;
            padding-bottom: 20px;
            border-bottom: 1px solid var(--border-color);
        }

        .brand-area h2 {
            font-size: 20px;
            color: var(--blue-accent);
            font-weight: 700;
        }

        .brand-area .subtitle {
            font-size: 11px;
            color: var(--text-muted);
        }

        .filter-group {
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .filter-group label {
            font-weight: 600;
            font-size: 14px;
            color: var(--text-muted);
        }

        .checkbox-list {
            display: flex;
            flex-direction: column;
            gap: 6px;
        }

        .checkbox-item {
            display: flex;
            align-items: center;
            gap: 10px;
            font-size: 13px;
            cursor: pointer;
            padding: 6px 10px;
            border-radius: 4px;
            transition: background 0.2s;
            color: var(--text-muted);
        }

        .checkbox-item:hover {
            background: rgba(255,255,255,0.05);
            color: var(--text-color);
        }

        .checkbox-item input[type="checkbox"] {
            width: 16px;
            height: 16px;
            cursor: pointer;
            accent-color: var(--blue-accent);
        }

        .checkbox-item.checked {
            color: var(--text-color);
        }

        .custom-file-upload {
            display: block;
            background: linear-gradient(135deg, var(--blue-accent), #2563eb);
            color: white;
            text-align: center;
            padding: 12px;
            border-radius: 8px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
            border: none;
            font-size: 14px;
        }

        .custom-file-upload:hover {
            transform: translateY(-2px);
            box-shadow: 0 4px 12px rgba(59, 130, 246, 0.3);
        }

        .file-name-display {
            font-size: 11px;
            color: var(--text-muted);
            text-align: center;
            display: block;
            margin-top: 5px;
            min-height: 20px;
        }

        .filter-count {
            font-size: 12px;
            color: var(--text-muted);
            text-align: center;
            padding: 12px;
            border-top: 1px solid var(--border-color);
            margin-top: auto;
        }

        .btn-logout {
            width: 100%;
            margin-top: 10px;
            padding: 10px;
            background: var(--danger);
            color: white;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            font-size: 14px;
            font-weight: 600;
            transition: all 0.3s ease;
        }

        .btn-logout:hover {
            background: #dc2626;
            transform: translateY(-1px);
        }

        .main-content {
            flex: 1;
            padding: 32px;
            display: flex;
            flex-direction: column;
            gap: 32px;
            max-width: calc(100% - 280px);
            overflow-x: hidden;
        }

        .dashboard-header {
            background: var(--card-bg);
            padding: 20px 24px;
            border-radius: 12px;
            text-align: center;
            box-shadow: var(--shadow-sm);
            border: 1px solid var(--border-color);
        }

        .dashboard-header h1 {
            font-size: 22px;
            color: var(--purple-accent);
            font-weight: 700;
        }

        .kpi-section {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 20px;
        }

        .kpi-card {
            background: var(--card-bg);
            border-radius: 12px;
            padding: 24px;
            border: 1px solid var(--border-color);
            text-align: center;
            transition: all 0.3s ease;
            box-shadow: var(--shadow-sm);
            position: relative;
            overflow: hidden;
        }

        .kpi-card::before {
            content: '';
            position: absolute;
            top: 0;
            right: 0;
            width: 4px;
            height: 100%;
            background: var(--blue-accent);
        }

        .kpi-card.revenue::before { background: var(--green-accent); }
        .kpi-card.appointments::before { background: var(--purple-accent); }
        .kpi-card.rate::before { background: var(--blue-accent); }

        .kpi-card:hover {
            transform: translateY(-3px);
            box-shadow: var(--shadow-md);
        }

        .kpi-card span {
            font-size: 13px;
            color: var(--text-muted);
            font-weight: 600;
            display: block;
            margin-bottom: 8px;
        }

        .kpi-card h2 {
            font-size: 28px;
            font-weight: 700;
        }

        .kpi-card.revenue h2 { color: var(--green-accent); }
        .kpi-card.appointments h2 { color: var(--purple-accent); }
        .kpi-card.rate h2 { color: var(--blue-accent); }

        .charts-grid {
            display: grid;
            grid-template-columns: 1.6fr 1.4fr;
            gap: 24px;
            min-height: 380px;
        }

        .chart-box {
            background: var(--card-bg);
            padding: 24px;
            border-radius: 12px;
            border: 1px solid var(--border-color);
            display: flex;
            flex-direction: column;
            gap: 16px;
            box-shadow: var(--shadow-sm);
        }

        .chart-box h3 {
            font-size: 16px;
            color: var(--text-color);
            font-weight: 600;
        }

        .chart-container {
            position: relative;
            flex: 1;
            width: 100%;
            min-height: 280px;
        }

        .toast {
            position: fixed;
            bottom: 20px;
            left: 20px;
            background: #1e293b;
            color: white;
            padding: 14px 24px;
            border-radius: 8px;
            z-index: 9999;
            opacity: 0;
            transform: translateY(100px);
            transition: all 0.4s ease;
            box-shadow: var(--shadow-md);
            max-width: 400px;
            border: 1px solid var(--border-color);
            font-weight: 600;
        }

        .toast.show {
            opacity: 1;
            transform: translateY(0);
        }

        .toast.success { border-right: 4px solid var(--green-accent); }
        .toast.error { border-right: 4px solid var(--danger); }
        .toast.info { border-right: 4px solid var(--blue-accent); }
        .toast.warning { border-right: 4px solid #f59e0b; }

        @media (max-width: 1024px) {
            .charts-grid { grid-template-columns: 1fr; }
            .filter-sidebar { width: 240px; }
            .main-content { max-width: calc(100% - 240px); padding: 20px; }
        }

        @media (max-width: 768px) {
            .dashboard-wrapper { flex-direction: column; }
            .filter-sidebar {
                width: 100%;
                height: auto;
                min-height: auto;
                position: relative;
                border-left: none;
                border-bottom: 1px solid var(--border-color);
                padding: 16px;
            }
            .main-content { 
                max-width: 100%; 
                padding: 16px; 
            }
            .kpi-section { 
                grid-template-columns: 1fr; 
            }
            .charts-grid {
                grid-template-columns: 1fr;
                min-height: 300px;
            }
        }
    </style>
</head>
<body>
    <div class="dashboard-wrapper">
        <aside class="filter-sidebar">
            <div class="brand-area">
                <h2 id="dashboard-title">APEX STRATEGIES</h2>
                <span class="subtitle">Dashboard</span>
            </div>

            <div class="filter-group">
                <label>📅 Data Range</label>
                <input type="text" id="data-range" value="Current Period" disabled>
            </div>

            <div class="filter-group">
                <label>👨‍⚕️ Doctor Name</label>
                <div class="checkbox-list" id="doctor-filters">
                    <label class="checkbox-item checked"><input type="checkbox" class="doctor-filter" value="Dr. Ahmad" checked> Dr. Ahmad</label>
                    <label class="checkbox-item checked"><input type="checkbox" class="doctor-filter" value="Dr. Layla" checked> Dr. Layla</label>
                    <label class="checkbox-item checked"><input type="checkbox" class="doctor-filter" value="Dr. Sarah" checked> Dr. Sarah</label>
                </div>
            </div>

            <div class="filter-group">
                <label>🛠️ Service Type</label>
                <div class="checkbox-list" id="service-filters">
                    <label class="checkbox-item checked"><input type="checkbox" class="service-filter" value="Cleaning" checked> Cleaning</label>
                    <label class="checkbox-item checked"><input type="checkbox" class="service-filter" value="Filling" checked> Filling</label>
                    <label class="checkbox-item checked"><input type="checkbox" class="service-filter" value="Implant" checked> Implant</label>
                </div>
            </div>

            <div class="filter-group upload-box">
                <label for="excel-file-input" class="custom-file-upload">📁 Upload Excel Data</label>
                <input type="file" id="excel-file-input" accept=".xlsx, .xls" style="display:none;">
                <span class="file-name-display" id="file-name-display"></span>
            </div>

            <div class="filter-count">
                <span id="record-count">0 records</span>
                <button class="btn-logout" onclick="logout()">🚪 تسجيل الخروج</button>
            </div>
        </aside>

        <main class="main-content">
            <header class="dashboard-header">
                <h1 id="main-header-title">APEX STRATEGIES</h1>
            </header>

            <section class="kpi-section" id="kpi-container"></section>

            <section class="charts-grid">
                <div class="chart-box">
                    <h3 id="line-chart-title">📈 Monthly Revenue Trend</h3>
                    <div class="chart-container">
                        <canvas id="revenueTrendChart"></canvas>
                    </div>
                </div>
                <div class="chart-box">
                    <h3 id="bar-chart-title">📊 Revenue by Lead Source</h3>
                    <div class="chart-container">
                        <canvas id="leadSourceChart"></canvas>
                    </div>
                </div>
            </section>
        </main>
    </div>

    <div id="toast" class="toast"></div>

    <script>
        // ==============================================
        // CONFIGURATION
        // ==============================================
        const API_BASE_URL = 'http://127.0.0.1:8000/api';

        // ==============================================
        // STATE
        // ==============================================
        let state = {
            token: null,
            userId: null,
            rawData: [],
            filteredData: [],
            charts: {
                revenueTrend: null,
                leadSource: null
            },
            isLoaded: false
        };

        // ==============================================
        // TOAST
        // ==============================================
        function showToast(message, type = 'info', duration = 4000) {
            const toast = document.getElementById('toast');
            if (!toast) return;
            toast.textContent = message;
            toast.className = `toast ${type} show`;
            clearTimeout(toast._timeout);
            toast._timeout = setTimeout(() => {
                toast.classList.remove('show');
            }, duration);
        }

        // ==============================================
        // TOKEN MANAGEMENT
        // ==============================================
        function getToken() {
            return localStorage.getItem('access_token');
        }

        function getRefreshToken() {
            return localStorage.getItem('refresh_token');
        }

        function getUserId() {
            if (state.userId) return state.userId;
            const id = localStorage.getItem('user_id');
            if (id) {
                state.userId = parseInt(id);
                return state.userId;
            }
            const userData = localStorage.getItem('user_data');
            if (userData) {
                try {
                    const parsed = JSON.parse(userData);
                    state.userId = parsed.user_id;
                    return state.userId;
                } catch (e) {}
            }
            return null;
        }

        function isTokenExpired() {
            const expiry = localStorage.getItem('token_expiry');
            if (!expiry) return true;
            return Date.now() > (parseInt(expiry) - 5 * 60 * 1000);
        }

        function hasValidToken() {
            const token = getToken();
            if (!token || token.length < 20) return false;
            if (isTokenExpired()) return false;
            return true;
        }

        function redirectToLogin() {
            localStorage.clear();
            window.location.href = 'login.html';
        }

        // ==============================================
        // AUTHENTICATED FETCH
        // ==============================================
        async function fetchWithAuth(url, options = {}, retryCount = 0) {
            let token = localStorage.getItem('access_token');
            
            if (!token || isTokenExpired()) {
                console.log('🔄 Token expired, refreshing...');
                
                const refreshToken = localStorage.getItem('refresh_token');
                if (refreshToken) {
                    try {
                        const response = await fetch(`${API_BASE_URL}/refresh`, {
                            method: 'POST',
                            headers: { 'Content-Type': 'application/json' },
                            body: JSON.stringify({ refresh_token: refreshToken })
                        });
                        
                        const data = await response.json();
                        
                        if (response.ok && data.access_token) {
                            localStorage.setItem('access_token', data.access_token);
                            token = data.access_token;
                            if (data.expires_in) {
                                localStorage.setItem('token_expiry', (Date.now() + data.expires_in * 1000).toString());
                            }
                            console.log('✅ Token refreshed');
                        } else {
                            redirectToLogin();
                            throw new Error('Session expired');
                        }
                    } catch (error) {
                        redirectToLogin();
                        throw new Error('Session expired');
                    }
                } else {
                    redirectToLogin();
                    throw new Error('No refresh token');
                }
            }
            
            if (!token) {
                redirectToLogin();
                throw new Error('No token');
            }
            
            try {
                const response = await fetch(url, {
                    ...options,
                    headers: {
                        ...options.headers,
                        'Authorization': `Bearer ${token}`,
                        'ngrok-skip-browser-warning': 'true'
                    }
                });
                
                if (response.status === 401 && retryCount < 1) {
                    console.log('🔄 401 Unauthorized, retrying...');
                    
                    const refreshToken = localStorage.getItem('refresh_token');
                    if (refreshToken) {
                        try {
                            const refreshResponse = await fetch(`${API_BASE_URL}/refresh`, {
                                method: 'POST',
                                headers: { 'Content-Type': 'application/json' },
                                body: JSON.stringify({ refresh_token: refreshToken })
                            });
                            
                            const data = await refreshResponse.json();
                            
                            if (refreshResponse.ok && data.access_token) {
                                localStorage.setItem('access_token', data.access_token);
                                if (data.expires_in) {
                                    localStorage.setItem('token_expiry', (Date.now() + data.expires_in * 1000).toString());
                                }
                                return fetchWithAuth(url, options, retryCount + 1);
                            }
                        } catch (error) {}
                    }
                    
                    redirectToLogin();
                    throw new Error('Session expired');
                }
                
                return response;
            } catch (error) {
                console.error('❌ Fetch error:', error);
                throw error;
            }
        }

        // ==============================================
        // CHART MANAGEMENT - محسّن
        // ==============================================
        function destroyCharts() {
            if (state.charts.revenueTrend) {
                state.charts.revenueTrend.destroy();
                state.charts.revenueTrend = null;
            }
            if (state.charts.leadSource) {
                state.charts.leadSource.destroy();
                state.charts.leadSource = null;
            }
        }

        function renderCharts(records) {
            // تدمير المخططات القديمة
            destroyCharts();

            const ctx1 = document.getElementById('revenueTrendChart')?.getContext('2d');
            const ctx2 = document.getElementById('leadSourceChart')?.getContext('2d');

            if (!ctx1 || !ctx2) {
                console.warn('⚠️ Chart canvases not found');
                return;
            }

            if (!records || records.length === 0) {
                console.log('📊 No data for charts');
                return;
            }

            // ==========================================
            // 1. Monthly Revenue Trend (Line Chart)
            // ==========================================
            const monthlyData = {};
            records.forEach(record => {
                // دعم عدة تنسيقات للشهر
                let month = record.Month || record.month || record.Appointment_Month || 
                           record.appointment_month || record.Date || record.date || 'Other';
                
                // إذا كان التاريخ بصيغة مختلفة، حاول استخراج الشهر
                if (month && month.includes('/')) {
                    try {
                        const dateParts = month.split('/');
                        if (dateParts.length === 3) {
                            const monthNames = ['January', 'February', 'March', 'April', 'May', 'June',
                                               'July', 'August', 'September', 'October', 'November', 'December'];
                            const monthIndex = parseInt(dateParts[0]) - 1;
                            if (monthIndex >= 0 && monthIndex < 12) {
                                month = `${monthNames[monthIndex]} ${dateParts[2]}`;
                            }
                        }
                    } catch (e) {}
                }
                
                const revenue = parseFloat(record.Revenue || record.revenue || 0);
                monthlyData[month] = (monthlyData[month] || 0) + revenue;
            });

            // ترتيب الأشهر
            const monthOrder = ['January', 'February', 'March', 'April', 'May', 'June',
                               'July', 'August', 'September', 'October', 'November', 'December'];
            
            const sortedMonths = Object.keys(monthlyData).sort((a, b) => {
                const idxA = monthOrder.indexOf(a);
                const idxB = monthOrder.indexOf(b);
                if (idxA === -1 && idxB === -1) return a.localeCompare(b);
                if (idxA === -1) return 1;
                if (idxB === -1) return -1;
                return idxA - idxB;
            });

            const revenueValues = sortedMonths.map(m => monthlyData[m] || 0);

            // رسم المخطط الخطي
            if (revenueValues.length > 0 && revenueValues.some(v => v > 0)) {
                state.charts.revenueTrend = new Chart(ctx1, {
                    type: 'line',
                    data: {
                        labels: sortedMonths.length > 0 ? sortedMonths : ['Jan', 'Feb', 'Mar', 'Apr'],
                        datasets: [{
                            label: 'Monthly Revenue',
                            data: revenueValues.length > 0 ? revenueValues : [0, 0, 0, 0],
                            borderColor: '#8b5cf6',
                            backgroundColor: 'rgba(139, 92, 246, 0.15)',
                            fill: true,
                            borderWidth: 3,
                            tension: 0.3,
                            pointBackgroundColor: '#8b5cf6',
                            pointBorderColor: '#fff',
                            pointBorderWidth: 2,
                            pointRadius: 5,
                            pointHoverRadius: 7,
                        }]
                    },
                    options: {
                        responsive: true,
                        maintainAspectRatio: false,
                        plugins: {
                            legend: {
                                labels: {
                                    color: '#94a3b8',
                                    font: { family: 'Cairo', size: 12 }
                                }
                            }
                        },
                        scales: {
                            y: {
                                beginAtZero: true,
                                ticks: {
                                    color: '#94a3b8',
                                    callback: function(value) {
                                        if (value >= 1000000) {
                                            return '$' + (value / 1000000).toFixed(1) + 'M';
                                        } else if (value >= 1000) {
                                            return '$' + (value / 1000).toFixed(0) + 'K';
                                        }
                                        return '$' + value.toLocaleString();
                                    }
                                },
                                grid: { color: 'rgba(255,255,255,0.05)' }
                            },
                            x: {
                                ticks: { 
                                    color: '#94a3b8',
                                    maxRotation: 45,
                                    minRotation: 0,
                                    font: { size: 10 }
                                },
                                grid: { display: false }
                            }
                        }
                    }
                });
                console.log('✅ Line chart rendered with', revenueValues.length, 'data points');
            } else {
                console.log('⚠️ No data for line chart');
            }

            // ==========================================
            // 2. Revenue by Lead Source (Bar Chart)
            // ==========================================
            const leadData = {};
            records.forEach(record => {
                const source = record.Lead_Source || record.lead_source || 
                              record.LeadSource || record.Lead_Source || 'Unknown';
                const revenue = parseFloat(record.Revenue || record.revenue || 0);
                leadData[source] = (leadData[source] || 0) + revenue;
            });

            const leadSources = Object.keys(leadData);
            const leadValues = leadSources.map(s => leadData[s] || 0);
            const colors = ['#3b82f6', '#8b5cf6', '#10b981', '#f59e0b', '#ef4444', '#ec4899', '#14b8a6'];

            if (leadValues.length > 0 && leadValues.some(v => v > 0)) {
                state.charts.leadSource = new Chart(ctx2, {
                    type: 'bar',
                    data: {
                        labels: leadSources.length > 0 ? leadSources : ['Source 1', 'Source 2', 'Source 3', 'Source 4'],
                        datasets: [{
                            label: 'Revenue by Lead Source',
                            data: leadValues.length > 0 ? leadValues : [0, 0, 0, 0],
                            backgroundColor: leadSources.map((_, i) => colors[i % colors.length]),
                            borderWidth: 0,
                            borderRadius: 6,
                        }]
                    },
                    options: {
                        indexAxis: 'y',
                        responsive: true,
                        maintainAspectRatio: false,
                        plugins: {
                            legend: {
                                display: false
                            },
                            tooltip: {
                                callbacks: {
                                    label: function(context) {
                                        return '$' + context.parsed.x.toLocaleString();
                                    }
                                }
                            }
                        },
                        scales: {
                            y: {
                                ticks: {
                                    color: '#94a3b8',
                                    font: { family: 'Cairo', size: 11 }
                                },
                                grid: { display: false }
                            },
                            x: {
                                beginAtZero: true,
                                ticks: {
                                    color: '#94a3b8',
                                    callback: function(value) {
                                        if (value >= 1000000) {
                                            return '$' + (value / 1000000).toFixed(1) + 'M';
                                        } else if (value >= 1000) {
                                            return '$' + (value / 1000).toFixed(0) + 'K';
                                        }
                                        return '$' + value.toLocaleString();
                                    }
                                },
                                grid: { color: 'rgba(255,255,255,0.05)' }
                            }
                        }
                    }
                });
                console.log('✅ Bar chart rendered with', leadValues.length, 'data points');
            } else {
                console.log('⚠️ No data for bar chart');
            }
        }

        // ==============================================
        // DASHBOARD UPDATE - محسّن
        // ==============================================
        function updateDashboardUI(records) {
            console.log('📊 Updating dashboard with', records?.length || 0, 'records');
            
            const kpiContainer = document.getElementById('kpi-container');
            const recordCount = document.getElementById('record-count');

            if (!records || records.length === 0) {
                console.log('📊 No records to display');
                if (kpiContainer) {
                    kpiContainer.innerHTML = `
                        <div class="kpi-card revenue">
                            <span>💰 Total Revenue</span>
                            <h2>$0.0</h2>
                        </div>
                        <div class="kpi-card appointments">
                            <span>📋 Total Appointments</span>
                            <h2>0</h2>
                        </div>
                        <div class="kpi-card rate">
                            <span>📊 No-Show Rate</span>
                            <h2>0.0%</h2>
                        </div>
                    `;
                }
                if (recordCount) recordCount.textContent = '0 records';
                renderCharts([]);
                return;
            }

            // حساب الإحصائيات
            let totalRevenue = 0;
            let noShowCount = 0;
            let completedCount = 0;

            records.forEach(record => {
                const revenue = parseFloat(record.Revenue || record.revenue || 0);
                totalRevenue += revenue;
                
                const status = (record.Status || record.status || '').toLowerCase().trim();
                if (status.includes('no-show') || status.includes('no_show') || 
                    status.includes('canceled') || status.includes('cancelled') ||
                    status.includes('missed')) {
                    noShowCount++;
                } else if (status.includes('completed') || status.includes('complete') || 
                           status.includes('done') || status.includes('finished')) {
                    completedCount++;
                }
            });

            const noShowRate = records.length > 0 ? (noShowCount / records.length) * 100 : 0;

            console.log(`📊 Stats: Revenue=${totalRevenue}, Records=${records.length}, No-Show=${noShowCount}, Rate=${noShowRate.toFixed(1)}%`);

            // تحديث بطاقات KPI
            if (kpiContainer) {
                kpiContainer.innerHTML = `
                    <div class="kpi-card revenue">
                        <span>💰 Total Revenue</span>
                        <h2>$${totalRevenue.toLocaleString()}</h2>
                    </div>
                    <div class="kpi-card appointments">
                        <span>📋 Total Appointments</span>
                        <h2>${records.length}</h2>
                    </div>
                    <div class="kpi-card rate">
                        <span>📊 No-Show Rate</span>
                        <h2>${noShowRate.toFixed(1)}%</h2>
                    </div>
                `;
                console.log('✅ KPI cards updated');
            }

            if (recordCount) {
                recordCount.textContent = records.length + ' records';
            }

            // تحديث الرسوم البيانية
            renderCharts(records);
            console.log('✅ Dashboard update complete');
        }

        // ==============================================

        }

        // ==============================================
        // FILE UPLOAD - مع إعادة تحميل كامل
        // ==============================================
        async function handleFileUpload(file) {
            const nameDisplay = document.getElementById('file-name-display');
            if (nameDisplay) nameDisplay.textContent = `📄 ${file.name}`;

            const formData = new FormData();
            formData.append('file', file);

            try {
                showToast('⏳ جاري رفع الملف...', 'info');

                const response = await fetchWithAuth(`${API_BASE_URL}/dashboard/upload-excel`, {
                    method: 'POST',
                    body: formData
                });

                const result = await response.json();

                if (response.ok) {
                    if (result.analytics && Array.isArray(result.analytics) && result.analytics.length > 0) {
                        console.log('📊 Received', result.analytics.length, 'records from backend');
                        
                        // تحديث البيانات
                        state.rawData = result.analytics;
                        state.filteredData = result.analytics;
                        
                        // تحديث الواجهة
                        updateDashboardUI(result.analytics);
                        
                        // تحديث ملخص
                        if (result.summary) {
                            console.log('📊 Summary:', result.summary);
                        }
                        
                        showToast(`✅ تم رفع ${result.analytics.length} سجل بنجاح!`, 'success');
                    } else {
                        console.warn('⚠️ No analytics data in response:', result);
                        showToast('⚠️ لم يتم العثور على بيانات في الملف', 'warning');
                    }
                } else {
                    console.error('❌ Upload failed:', result);
                    showToast(`❌ ${result.detail || 'فشل رفع الملف'}`, 'error');
                }
            } catch (error) {
                console.error('❌ Upload error:', error);
                showToast('❌ خطأ في رفع الملف: ' + error.message, 'error');
            } finally {
                const fileInput = document.getElementById('excel-file-input');
                if (fileInput) fileInput.value = '';
            }
        }

        // ==============================================
        // FILTERS
        // ==============================================
        function applyFilters() {
            const selectedDoctors = Array.from(
                document.querySelectorAll('.doctor-filter:checked')
            ).map(cb => cb.value);

            const selectedServices = Array.from(
                document.querySelectorAll('.service-filter:checked')
            ).map(cb => cb.value);

            let filtered = state.rawData;

            if (selectedDoctors.length > 0 && state.rawData.length > 0) {
                filtered = filtered.filter(record => {
                    const doctor = record.Doctor_Name || record.doctor_name || '';
                    return selectedDoctors.includes(doctor);
                });
            }

            if (selectedServices.length > 0 && state.rawData.length > 0) {
                filtered = filtered.filter(record => {
                    const service = record.Service_Type || record.service_type || '';
                    return selectedServices.includes(service);
                });
            }

            state.filteredData = filtered;
            updateDashboardUI(filtered);
        }

        // ==============================================
        // LOGOUT
        // ==============================================
        function logout() {
            localStorage.clear();
            destroyCharts();
            showToast('✅ تم تسجيل الخروج', 'info', 3000);
            setTimeout(() => {
                window.location.href = 'login.html';
            }, 1000);
        }

        // ==============================================
        // INITIALIZATION
        // ==============================================
        async function initDashboard() {
            console.log('🚀 Initializing dashboard...');

            if (!hasValidToken()) {
                console.log('⚠️ No valid token, redirecting to login...');
                redirectToLogin();
                return;
            }

            const userId = getUserId();
            if (!userId) {
                console.log('⚠️ No user ID found, redirecting to login...');
                redirectToLogin();
                return;
            }

            console.log(`✅ User ID: ${userId}`);

            // تحميل البيانات التجريبية أولاً
            loadDemoData();

            // إعداد الفلاتر
            document.querySelectorAll('.doctor-filter, .service-filter').forEach(cb => {
                cb.addEventListener('change', () => {
                    const label = cb.closest('.checkbox-item');
                    if (cb.checked) {
                        label.classList.add('checked');
                    } else {
                        label.classList.remove('checked');
                    }
                    applyFilters();
                });
            });

            // إعداد رفع الملف
            const fileInput = document.getElementById('excel-file-input');
            if (fileInput) {
                fileInput.addEventListener('change', (e) => {
                    const file = e.target.files[0];
                    if (file) {
                        console.log('📁 File selected:', file.name);
                        handleFileUpload(file);
                    }
                    fileInput.value = '';
                });
            }

            // تطبيق الفلاتر
            applyFilters();

            console.log('✅ Dashboard initialized successfully!');
            state.isLoaded = true;
        }

        // ==============================================
        // EXPOSE TO CONSOLE
        // ==============================================
        window.logout = logout;
        window.loadDemoData = loadDemoData;
        window.updateDashboardUI = updateDashboardUI;
        window.renderCharts = renderCharts;

        // ==============================================
        // START
        // ==============================================
        document.addEventListener('DOMContentLoaded', initDashboard);
    </script>
</body>
