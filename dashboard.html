<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Apex Strategies - Clinic Data Analysis</title>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700&display=swap" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    
    <style>
        :root {
            --primary-bg: #F4F7F6;
            --sidebar-bg: #FFFFFF;
            --card-bg: #FFFFFF;
            --text-color: #2D3748;
            --text-muted: #718096;
            --green-accent: #00B67A;
            --purple-accent: #E040FB;
            --blue-accent: #3182CE;
            --border-color: #E2E8F0;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Cairo', sans-serif; }
        body { background-color: var(--primary-bg); color: var(--text-color); display: flex; min-height: 100vh; }
        .dashboard-wrapper { display: flex; width: 100%; }
        
        .filter-sidebar {
            width: 280px; background: var(--sidebar-bg); border-left: 1px solid var(--border-color);
            padding: 24px; display: flex; flex-direction: column; gap: 24px;
        }
        .brand-area { text-align: center; padding-bottom: 20px; border-bottom: 1px solid var(--border-color); }
        .brand-area h2 { font-size: 22px; color: var(--blue-accent); font-weight: 700; }
        
        .filter-group { display: flex; flex-direction: column; gap: 10px; }
        .filter-group label { font-weight: 600; font-size: 14px; }
        .filter-group input[type="text"] {
            width: 100%; padding: 8px 12px; border: 1px solid var(--border-color); border-radius: 6px; text-align: center;
        }
        .checkbox-list { display: flex; flex-direction: column; gap: 8px; }
        .checkbox-item { display: flex; align-items: center; gap: 10px; font-size: 13px; }

        .custom-file-upload {
            display: block; background: linear-gradient(135deg, var(--blue-accent), #2B6CB0);
            color: white; text-align: center; padding: 12px; border-radius: 8px; font-weight: 600; cursor: pointer;
            transition: transform 0.2s;
        }
        .custom-file-upload:hover { transform: translateY(-2px); }

        .main-content { flex: 1; padding: 32px; display: flex; flex-direction: column; gap: 32px; }
        .dashboard-header { background: #FFFFFF; padding: 20px; border-radius: 12px; text-align: center; }
        .dashboard-header h1 { font-size: 24px; color: var(--purple-accent); font-weight: 700; }

        .kpi-section { display: flex; gap: 24px; }
        .kpi-card {
            flex: 1; background: var(--card-bg); border-radius: 12px; padding: 24px;
            border: 1px solid var(--border-color); text-align: center;
        }
        .kpi-card span { font-size: 14px; color: var(--text-muted); font-weight: 600; }
        .kpi-card h2 { font-size: 32px; font-weight: 700; }
        .kpi-card.revenue h2 { color: var(--green-accent); }
        .kpi-card.appointments h2 { color: var(--purple-accent); }
        .kpi-card.rate h2 { color: #319795; }

        .charts-grid { display: grid; grid-template-columns: 1.6fr 1.4fr; gap: 24px; min-height: 380px; }
        .chart-box { background: var(--card-bg); padding: 24px; border-radius: 12px; border: 1px solid var(--border-color); display: flex; flex-direction: column; gap: 16px; }
        .chart-container { position: relative; flex: 1; width: 100%; height: 100%; }
    </style>
</head>
<body>

    <div class="dashboard-wrapper">
        <aside class="filter-sidebar">
            <div class="brand-area">
                <h2 id="dashboard-title">APEX STRATEGIES</h2>
                <span>CLINIC ANALYSIS</span>
            </div>
            
            <div class="filter-group">
                <label>Data Range</label>
                <input type="text" value="1/1/2026  -  4/11/2026" disabled>
            </div>

            <div class="filter-group">
                <label>Doctor Name</label>
                <div class="checkbox-list">
                    <label class="checkbox-item"><input type="checkbox" checked> Dr. Ahmad</label>
                    <label class="checkbox-item"><input type="checkbox" checked> Dr. Layla</label>
                    <label class="checkbox-item"><input type="checkbox" checked> Dr. Sarah</label>
                </div>
            </div>

            <div class="filter-group">
                <label>Service Type</label>
                <div class="checkbox-list">
                    <label class="checkbox-item"><input type="checkbox" checked> Cleaning</label>
                    <label class="checkbox-item"><input type="checkbox" checked> Filling</label>
                    <label class="checkbox-item"><input type="checkbox" checked> Implant</label>
                </div>
            </div>

            <div class="filter-group upload-box">
                <label for="excel-file-input" class="custom-file-upload">📁 رفع ملف البيانات (Excel)</label>
                <input type="file" id="excel-file-input" accept=".xlsx, .xls" style="display:none;">
                <span id="file-name-display" style="font-size: 11px; color: var(--text-muted); text-align: center; display: block; margin-top: 5px;"></span>
            </div>
        </aside>

        <main class="main-content">
            <header class="dashboard-header">
                <h1>APEX STRATEGIES : CLINIC DATA ANALYSIS</h1>
            </header>

            <section class="kpi-section" id="kpi-container">
                <div class="kpi-card revenue"><span>Total Revenue</span><h2 id="kpi-rev">$0.0</h2></div>
                <div class="kpi-card appointments"><span>Total Appointment</span><h2 id="kpi-app">0</h2></div>
                <div class="kpi-card rate"><span>No_Show Rate</span><h2 id="kpi-rate">0.0%</h2></div>
            </section>

            <section class="charts-grid">
                <div class="chart-box">
                    <h3>Monthly Revenue Trend</h3>
                    <div class="chart-container"><canvas id="revenueTrendChart"></canvas></div>
                </div>
                <div class="chart-box">
                    <h3>Sum of Revenue by Lead_Source</h3>
                    <div class="chart-container"><canvas id="leadSourceChart"></canvas></div>
                </div>
            </section>
        </main>
    </div>

    <script>
        document.addEventListener('DOMContentLoaded', async () => {
            // محاولة جلب التوكن من الذاكرة المحلية
            let token = localStorage.getItem('access_token');
            
            // تحسين الفحص: إذا لم يتم العثور على توكن تلقائي أو كان مسجلاً كـ null، نطلب من المستخدم تزويدنا به بدلاً من حظره مباشرة
            if (!token || token === "null" || token === "undefined" || token.length < 10) {
                token = prompt("🔒 لم يتم استرداد رمز الجلسة تلقائياً من صفحة الدخول. إذا كنت تملك الـ Token، يرجى لصقه هنا لتشغيل اللوحة الحية:");
                if (token && token.length > 10) {
                    localStorage.setItem('access_token', token);
                } else {
                    alert("تنبيه: لن تتمكن اللوحة من استدعاء البيانات بدون وجود Token صالح.");
                    return;
                }
            }

            const API_BASE_URL = 'https://veteran-antibody-strep.ngrok-free.dev/api';
            let revenueTrendChart = null;
            let leadSourceChart = null;

            async function loadDashboardData() {
                try {
                    // 1. جلب إعدادات اللوحة
                    const configResponse = await fetch(`${API_BASE_URL}/dashboard`, {
                        method: 'GET',
                        headers: { 'Authorization': `Bearer ${token}` }
                    });
                    if (configResponse.ok) {
                        const configData = await configResponse.json();
                        document.getElementById('dashboard-title').innerText = configData.dashboard_name;
                    }

                    // 2. جلب البيانات التحليلية
                    const analyticsResponse = await fetch(`${API_BASE_URL}/dashboard/analytics`, {
                        method: 'GET',
                        headers: { 'Authorization': `Bearer ${token}` }
                    });
                    
                    if (!analyticsResponse.ok) return;
                    const data = await analyticsResponse.json();

                    document.getElementById('kpi-rev').innerText = data[0].calculated_value;
                    document.getElementById('kpi-app').innerText = data[1].calculated_value;
                    document.getElementById('kpi-rate').innerText = data[2].calculated_value;

                    // رسم الرسوم البيانية
                    const ctxLine = document.getElementById('revenueTrendChart').getContext('2d');
                    if (revenueTrendChart) revenueTrendChart.destroy();
                    revenueTrendChart = new Chart(ctxLine, {
                        type: 'line',
                        data: {
                            labels: ['January', 'February', 'March', 'April'],
                            datasets: [{ label: 'Monthly Revenue', data: data[3].data_points, borderColor: '#E040FB', backgroundColor: 'rgba(224, 64, 251, 0.1)', fill: true, tension: 0.3 }]
                        },
                        options: { responsive: true, maintainAspectRatio: false }
                    });

                    const ctxBar = document.getElementById('leadSourceChart').getContext('2d');
                    if (leadSourceChart) leadSourceChart.destroy();
                    leadSourceChart = new Chart(ctxBar, {
                        type: 'bar',
                        data: {
                            labels: ['Friend Referral', 'TikTok', 'Google Maps', 'Instagram'],
                            datasets: [{ data: data[4].data_points, backgroundColor: ['#3182CE', '#319795', '#805AD5', '#D53F8C'] }]
                        },
                        options: { indexAxis: 'y', responsive: true, maintainAspectRatio: false }
                    });
                } catch (err) { console.error("Error loading data:", err); }
            }

            // حدث رفع ملف الإكسيل مع معالجة الرابط البرمجي والتوكن
            document.getElementById('excel-file-input').addEventListener('change', async (e) => {
                const file = e.target.files[0];
                if (!file) return;

                const nameDisplay = document.getElementById('file-name-display');
                if (nameDisplay) nameDisplay.innerText = `جاري معالجة: ${file.name}`;

                const formData = new FormData();
                formData.append('file', file); 

                try {
                    const uploadUrl = `${API_BASE_URL}/dashboard/upload-excel?token=${encodeURIComponent(token)}`;
                    const response = await fetch(uploadUrl, {
                        method: 'POST',
                        headers: { 'Authorization': `Bearer ${token}` },
                        body: formData
                    });

                    if (response.ok) {
                        alert("تم رفع ومعالجة ملف الإكسيل بنجاح!");
                        await loadDashboardData();
                    } else {
                        alert("فشل رفع الملف. تأكد من صلاحية ومطابقة الـ Token الخاص بالجلسة الحالية.");
                    }
                } catch (error) { alert("حدث خطأ أثناء الاتصال بالسيرفر لمعالجة البيانات."); }
                finally { if (nameDisplay) nameDisplay.innerText = ""; }
            });

            await loadDashboardData();
        });
    </script>
</body>
</html>
